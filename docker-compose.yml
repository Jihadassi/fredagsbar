
services:
  api:
    build: .
    ports:
      - "5000:5000"
    command: uv run --no-sync python api.py

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:5000
    command: uv run --no-sync streamlit run app.py --server.address=0.0.0.0
    depends_on:
      - api
